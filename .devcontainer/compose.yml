name: HP

services:
  devcontainer:
    hostname: ${DEVCONTAINER_HOST_NAME}
    container_name: ${DEVCONTAINER_CONTAINER_NAME}
    image: ${DEVCONTAINER_IMAGE_NAME}
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - type: bind
        source: ${LOCAL_WORKSPACE_FOLDER:-./../}
        target: /workspace
        consistency: cached
    ports:
      - ${HOST_IP}:${DEVCONTAINER_HOST_PORT}:3000
    tty: true
